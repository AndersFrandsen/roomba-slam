require conf/machine/raspberrypi0-2w-64.conf

# Free primary UART (/dev/ttyAMA0) for Roomba OI by disabling onboard Bluetooth
RPI_EXTRA_CONFIG:append = '\ndtoverlay=disable-bt\n'
MACHINE_FEATURES:append = " uart"

MACHINE_FEATURES:append = " usbhost"

# Disable the BT UART service that uses /dev/ttyAMA0
SYSTEMD_AUTO_ENABLE:hciuart = "disable"
