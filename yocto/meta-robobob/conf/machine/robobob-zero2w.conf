require conf/machine/raspberrypi0-2w-64.conf

RPI_EXTRA_CONFIG:append = '\ndtoverlay=disable-bt\n'
MACHINE_FEATURES:append = " uart"

# Headless: disable vc4 overlay
DISABLE_VC4GRAPHICS = "1"
# gpu_mem=32 gives Linux 480M, but 16 makes it fall back to 128M for some reason
GPU_MEM = "32"

MACHINE_FEATURES:append = " usbhost"
